<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SocraTech AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#212121;
    color:white;
    display:flex;
    height:100vh;
}

/* 왼쪽 사이드바 */

.sidebar{
    width:260px;
    background:#171717;
    border-right:1px solid #2f2f2f;
    display:flex;
    flex-direction:column;
    padding:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

.new-chat{
    background:#2b2b2b;
    border:none;
    color:white;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:20px;
    transition:0.2s;
}

.new-chat:hover{
    background:#3b3b3b;
}

.history{
    color:#bdbdbd;
    font-size:14px;
    margin-top:10px;
}

.history-item{
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    margin-top:8px;
    transition:0.2s;
}

.history-item:hover{
    background:#2a2a2a;
}

/* 메인 채팅 */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* 상단 */

.topbar{
    height:70px;
    border-bottom:1px solid #2f2f2f;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:#212121;
}

.ai-name{
    font-size:22px;
    font-weight:bold;
}

.login-btn{
    background:#10a37f;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

/* 채팅 영역 */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* 메시지 */

.message{
    max-width:70%;
    padding:18px;
    border-radius:18px;
    line-height:1.7;
    font-size:15px;
    animation:fade 0.3s ease;
}

.bot{
    background:#2b2b2b;
    align-self:flex-start;
}

.user{
    background:#10a37f;
    align-self:flex-end;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* 선택 버튼 */

.choices{
    padding:20px;
    border-top:1px solid #2f2f2f;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:#171717;
}

.choice-btn{
    background:#2b2b2b;
    border:none;
    color:white;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
    text-align:left;
    transition:0.2s;
    font-size:15px;
}

.choice-btn:hover{
    background:#3d3d3d;
    transform:translateY(-2px);
}

/* 리포트 */

.report{
    background:#2b2b2b;
    padding:25px;
    border-radius:20px;
    margin-top:10px;
}

.report h2{
    margin-bottom:20px;
}

.bar{
    width:100%;
    height:18px;
    background:#3b3b3b;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.fill{
    height:100%;
    background:#10a37f;
}

/* 모바일 */

@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .message{
        max-width:90%;
    }

}

</style>
</head>

<body>

<!-- 사이드바 -->

<div class="sidebar">

    <div class="logo">SocraTech</div>

    <button class="new-chat">
        + 새 대화
    </button>

    <div class="history">이전 대화</div>

    <div class="history-item">
        진로 고민
    </div>

    <div class="history-item">
        인간관계 문제
    </div>

    <div class="history-item">
        공부 동기
    </div>

</div>

<!-- 메인 -->

<div class="main">

    <!-- 상단바 -->

    <div class="topbar">

        <div class="ai-name">
            SocraTech AI
        </div>

        <button class="login-btn">
            로그인
        </button>

    </div>

    <!-- 채팅 영역 -->

    <div class="chat-area" id="chatArea">
    </div>

    <!-- 선택지 -->

    <div class="choices" id="choices">
    </div>

</div>

<script>

const chatArea = document.getElementById("chatArea");
const choicesDiv = document.getElementById("choices");

let current = 0;

const steps = [

{
    question:
    "안녕하세요. 오늘 가장 고민되는 문제는 무엇인가요?",

    choices:[
        {
            text:"진로가 너무 불안해요",
            reply:"흥미롭네요. 그런데 정말 '완벽하게 확신할 수 있는 진로'가 존재한다고 생각하시나요?"
        },

        {
            text:"공부 의욕이 없어요",
            reply:"의욕이 없다는 건 목표가 없는 걸까요, 아니면 너무 지쳐버린 걸까요?"
        },

        {
            text:"인간관계가 힘들어요",
            reply:"사람과의 관계에서 가장 반복적으로 나타나는 문제는 무엇인가요?"
        }
    ]
},

{
    question:
    "그 문제의 가장 큰 원인은 무엇이라고 생각하나요?",

    choices:[
        {
            text:"자신감 부족",
            reply:"그렇다면 질문자님이 생각하는 '자신감 있는 사람'은 어떤 사람인가요?"
        },

        {
            text:"실패 경험",
            reply:"과거의 실패가 지금의 선택 기준까지 결정하고 있는 걸까요?"
        },

        {
            text:"주변 환경",
            reply:"환경 때문이라고 느끼는군요. 하지만 같은 환경에서도 다른 결과를 만드는 사람도 있지 않을까요?"
        }
    ]
},

{
    question:
    "지금 가장 바꾸고 싶은 것은 무엇인가요?",

    choices:[
        {
            text:"생각 습관",
            reply:"좋습니다. 평소 어떤 순간에 깊게 고민하지 않고 결론을 내려버리나요?"
        },

        {
            text:"행동 방식",
            reply:"그렇다면 가장 먼저 바꿀 수 있는 아주 작은 행동 하나는 무엇일까요?"
        },

        {
            text:"감정 조절",
            reply:"감정이 가장 크게 흔들리는 상황은 어떤 순간인가요?"
        }
    ]
},

{
    question:
    "마지막으로, 지금 당신에게 가장 필요한 것은 무엇이라고 생각하나요?",

    choices:[
        {
            text:"명확한 목표",
            reply:"그 목표는 정말 본인의 선택인가요, 아니면 타인의 기대에 가까운가요?"
        },

        {
            text:"휴식",
            reply:"충분히 쉬지 못하게 만드는 가장 큰 이유는 무엇인가요?"
        },

        {
            text:"새로운 도전",
            reply:"실패 가능성이 있어도 도전하고 싶은 이유는 무엇인가요?"
        }
    ]
}

];

function addMessage(text, type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerHTML = text;

    chatArea.appendChild(msg);

    chatArea.scrollTop = chatArea.scrollHeight;
}

function typingEffect(callback){

    const typing = document.createElement("div");

    typing.classList.add("message","bot");

    typing.innerHTML = "SocraTech AI가 생각중입니다...";

    chatArea.appendChild(typing);

    chatArea.scrollTop = chatArea.scrollHeight;

    setTimeout(()=>{

        typing.remove();
        callback();

    },1000);
}

function showStep(){

    choicesDiv.innerHTML = "";

    if(current >= steps.length){

        showReport();
        return;
    }

    typingEffect(()=>{

        addMessage(steps[current].question,"bot");

        steps[current].choices.forEach(choice=>{

            const btn = document.createElement("button");

            btn.classList.add("choice-btn");

            btn.innerText = choice.text;

            btn.onclick = ()=>{

                addMessage(choice.text,"user");

                choicesDiv.innerHTML = "";

                typingEffect(()=>{

                    addMessage(choice.reply,"bot");

                    current++;

                    setTimeout(()=>{

                        showStep();

                    },700);

                });

            };

            choicesDiv.appendChild(btn);

        });

    });

}

function showReport(){

    const report = document.createElement("div");

    report.classList.add("report");

    report.innerHTML = `

        <h2>🧠 나의 상위 인지 성장 리포트</h2>

        <p style="margin-bottom:20px;">
        당신은 문제를 단순 감정이 아닌,
        원인과 행동 관점으로 다시 분석하기 시작했습니다.
        </p>

        <p>비판적 사고력</p>
        <div class="bar">
            <div class="fill" style="width:85%;"></div>
        </div>

        <p>문해력</p>
        <div class="bar">
            <div class="fill" style="width:72%;"></div>
        </div>

        <p>인지적 유연성</p>
        <div class="bar">
            <div class="fill" style="width:90%;"></div>
        </div>

        <p>메타인지</p>
        <div class="bar">
            <div class="fill" style="width:80%;"></div>
        </div>

    `;

    chatArea.appendChild(report);

    chatArea.scrollTop = chatArea.scrollHeight;

}

showStep();

</script>

</body>
</html>
