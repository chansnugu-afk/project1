<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocraTech</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f3f5f7;
    }

    header{
      background:#1f2937;
      color:white;
      padding:15px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .menu{
      font-size:24px;
      cursor:pointer;
    }

    .login-btn{
      background:white;
      color:#1f2937;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .chat-container{
      max-width:800px;
      margin:30px auto;
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .message{
      margin-bottom:20px;
      line-height:1.6;
    }

    .bot{
      color:#2563eb;
      font-weight:bold;
    }

    .user{
      color:#111827;
      font-weight:bold;
    }

    .choices{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:20px;
    }

    button.choice-btn{
      padding:14px;
      border:none;
      border-radius:12px;
      background:#e5e7eb;
      cursor:pointer;
      transition:0.2s;
      text-align:left;
      font-size:15px;
    }

    button.choice-btn:hover{
      background:#cbd5e1;
    }

    .report{
      margin-top:30px;
      padding:20px;
      background:#eff6ff;
      border-radius:15px;
    }

    .graph{
      height:20px;
      background:#dbeafe;
      border-radius:10px;
      margin-bottom:12px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:#2563eb;
    }
  </style>
</head>

<body>

<header>
  <div class="menu">☰</div>
  <h2>SocraTech</h2>
  <button class="login-btn">로그인</button>
</header>

<div class="chat-container">

  <div id="chat"></div>

  <div class="choices" id="choices"></div>

</div>

<script>

const steps = [

  {
    question:
    "요즘 가장 고민되는 문제는 무엇인가요?",

    choices:[
      {
        text:"진로가 너무 불안해요",
        reply:"미래에 대한 불안이 크군요. 그런데 완벽하게 확신할 수 있는 진로가 정말 존재할까요?"
      },
      {
        text:"공부 의욕이 없어요",
        reply:"의욕이 없다는 건 흥미를 잃었다는 의미일까요, 아니면 지쳤다는 의미일까요?"
      },
      {
        text:"인간관계가 힘들어요",
        reply:"사람들과의 관계에서 가장 힘든 순간은 어떤 상황인가요?"
      }
    ]
  },

  {
    question:
    "그 문제에서 가장 큰 원인은 무엇이라고 생각하나요?",

    choices:[
      {
        text:"내 자신감 부족",
        reply:"자신감 부족이라고 정의했군요. 그렇다면 자신감은 정확히 어떤 상태를 의미하나요?"
      },
      {
        text:"주변 환경",
        reply:"환경 때문이라고 느끼는군요. 하지만 환경이 같아도 다르게 행동하는 사람도 있지 않을까요?"
      },
      {
        text:"실패 경험",
        reply:"과거 경험이 영향을 준 것 같군요. 그 경험이 지금의 선택까지 제한하고 있을까요?"
      }
    ]
  },

  {
    question:
    "스스로 바꾸고 싶은 부분은 무엇인가요?",

    choices:[
      {
        text:"생각하는 습관",
        reply:"좋아요. 그렇다면 평소 어떤 순간에 깊게 생각하지 않고 결론을 내리나요?"
      },
      {
        text:"행동 방식",
        reply:"행동을 바꾸고 싶군요. 작은 행동 하나만 바꾼다면 무엇부터 시작할 수 있을까요?"
      },
      {
        text:"감정 조절",
        reply:"감정 조절이 중요하다고 느끼는군요. 감정이 가장 흔들리는 상황은 언제인가요?"
      }
    ]
  },

  {
    question:
    "지금 가장 필요한 것은 무엇이라고 생각하나요?",

    choices:[
      {
        text:"명확한 목표",
        reply:"목표가 필요하군요. 그렇다면 정말 원하는 목표는 남의 기대인가요, 자신의 선택인가요?"
      },
      {
        text:"휴식",
        reply:"휴식이 필요하군요. 쉬지 못하게 만드는 가장 큰 이유는 무엇인가요?"
      },
      {
        text:"새로운 도전",
        reply:"새로운 도전을 원하네요. 실패 가능성이 있어도 도전하고 싶은 이유는 무엇인가요?"
      }
    ]
  }

];

let currentStep = 0;

const chat = document.getElementById("chat");
const choicesDiv = document.getElementById("choices");

function addMessage(sender,text){

  const div = document.createElement("div");
  div.className = "message";

  div.innerHTML = `<span class="${sender}">
  ${sender === "bot" ? "SocraTech" : "나"}
  </span> : ${text}`;

  chat.appendChild(div);

  window.scrollTo(0, document.body.scrollHeight);
}

function showStep(){

  choicesDiv.innerHTML = "";

  if(currentStep >= steps.length){
    showReport();
    return;
  }

  const step = steps[currentStep];

  addMessage("bot", step.question);

  step.choices.forEach(choice => {

    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerText = choice.text;

    btn.onclick = () => {

      addMessage("user", choice.text);

      setTimeout(() => {
        addMessage("bot", choice.reply);

        currentStep++;

        setTimeout(() => {
          showStep();
        }, 1000);

      }, 500);
    };

    choicesDiv.appendChild(btn);

  });
}

function showReport(){

  choicesDiv.innerHTML = "";

  const report = document.createElement("div");
  report.className = "report";

  report.innerHTML = `
    <h2>🧠 나의 상위 인지 성장 리포트</h2>

    <p>
    당신은 대화를 통해 자신의 문제를 단순 감정이 아닌
    원인과 행동 관점에서 다시 바라보기 시작했습니다.
    </p>

    <h3>인지 영역 성장</h3>

    <p>비판적 사고력</p>
    <div class="graph">
      <div class="fill" style="width:85%"></div>
    </div>

    <p>문해력</p>
    <div class="graph">
      <div class="fill" style="width:70%"></div>
    </div>

    <p>인지적 유연성</p>
    <div class="graph">
      <div class="fill" style="width:90%"></div>
    </div>

    <p>메타인지</p>
    <div class="graph">
      <div class="fill" style="width:80%"></div>
    </div>
  `;

  chat.appendChild(report);
}

showStep();

</script>

</body>
</html>
