<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SocraTech AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#212121;
    color:white;
    display:flex;
    height:100vh;
}

/* 사이드바 */

.sidebar{
    width:260px;
    background:#171717;
    border-right:1px solid #2f2f2f;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.new-chat{
    background:#2b2b2b;
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:20px;
    transition:0.2s;
}

.new-chat:hover{
    background:#3a3a3a;
}

.history-title{
    color:#aaaaaa;
    margin-bottom:10px;
    font-size:14px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-item{
    background:#242424;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}

.history-item:hover{
    background:#333;
}

/* 메인 */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* 상단바 */

.topbar{
    height:70px;
    border-bottom:1px solid #2f2f2f;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.ai-name{
    font-size:22px;
    font-weight:bold;
}

.login-btn{
    background:#10a37f;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

/* 채팅 영역 */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:40px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* 시작 화면 */

.start-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.start-title{
    font-size:42px;
    font-weight:bold;
    margin-bottom:40px;
    color:#e5e5e5;
}

.start-choices{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.start-btn{
    background:#2b2b2b;
    border:none;
    color:white;
    padding:18px;
    border-radius:16px;
    cursor:pointer;
    text-align:left;
    transition:0.2s;
    font-size:16px;
}

.start-btn:hover{
    background:#3a3a3a;
    transform:translateY(-2px);
}

/* 메시지 */

.message{
    max-width:70%;
    padding:18px;
    border-radius:18px;
    line-height:1.7;
    animation:fade 0.3s ease;
}

.bot{
    background:#2b2b2b;
    align-self:flex-start;
}

.user{
    background:#10a37f;
    align-self:flex-end;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* 선택지 */

.choices{
    padding:20px;
    border-top:1px solid #2f2f2f;
    background:#171717;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.choice-btn{
    background:#2b2b2b;
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
    text-align:left;
    transition:0.2s;
}

.choice-btn:hover{
    background:#3a3a3a;
}

/* 리포트 */

.report{
    background:#2b2b2b;
    padding:25px;
    border-radius:20px;
}

.bar{
    width:100%;
    height:18px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:16px;
}

.fill{
    height:100%;
    background:#10a37f;
}

/* 모바일 */

@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .message{
        max-width:90%;
    }

    .start-title{
        font-size:30px;
    }

}

</style>
</head>

<body>

<!-- 사이드바 -->

<div class="sidebar">

    <div class="logo">
        SocraTech
    </div>

    <button class="new-chat" onclick="resetChat()">
        + 새 대화
    </button>

    <div class="history-title">
        이전 대화
    </div>

    <div class="history-list" id="historyList">

    </div>

</div>

<!-- 메인 -->

<div class="main">

    <div class="topbar">

        <div class="ai-name">
            SocraTech AI
        </div>

        <button class="login-btn">
            로그인
        </button>

    </div>

    <div class="chat-area" id="chatArea">

    </div>

    <div class="choices" id="choices">

    </div>

</div>

<script>

const chatArea = document.getElementById("chatArea");
const choicesDiv = document.getElementById("choices");
const historyList = document.getElementById("historyList");

let current = 0;
let currentConversationHTML = "";

const steps = [

{
    question:"그 문제의 가장 큰 원인은 무엇이라고 생각하나요?",

    choices:[

        {
            text:"자신감 부족",
            reply:"그렇다면 질문자님이 생각하는 '자신감 있는 사람'은 어떤 사람인가요?"
        },

        {
            text:"실패 경험",
            reply:"과거의 실패가 현재의 선택 기준까지 결정하고 있는 걸까요?"
        },

        {
            text:"주변 환경",
            reply:"환경 때문이라고 느끼는군요. 하지만 같은 환경에서도 다른 결과를 만드는 사람도 있지 않을까요?"
        }

    ]
},

{
    question:"지금 가장 바꾸고 싶은 것은 무엇인가요?",

    choices:[

        {
            text:"생각 습관",
            reply:"평소 어떤 순간에 깊게 고민하지 않고 결론을 내려버리나요?"
        },

        {
            text:"행동 방식",
            reply:"그렇다면 가장 먼저 바꿀 수 있는 아주 작은 행동 하나는 무엇일까요?"
        },

        {
            text:"감정 조절",
            reply:"감정이 가장 크게 흔들리는 상황은 어떤 순간인가요?"
        }

    ]
},

{
    question:"마지막으로, 지금 당신에게 가장 필요한 것은 무엇인가요?",

    choices:[

        {
            text:"명확한 목표",
            reply:"그 목표는 정말 본인의 선택인가요, 아니면 타인의 기대에 가까운가요?"
        },

        {
            text:"휴식",
            reply:"충분히 쉬지 못하게 만드는 가장 큰 이유는 무엇인가요?"
        },

        {
            text:"새로운 도전",
            reply:"실패 가능성이 있어도 도전하고 싶은 이유는 무엇인가요?"
        }

    ]
}

];

/* 시작 화면 */

function showStartScreen(){

    chatArea.innerHTML = `

        <div class="start-screen">

            <div class="start-title">
                안녕하세요.<br>
                오늘의 고민은 무엇인가요?
            </div>

            <div class="start-choices">

                <button class="start-btn"
                onclick="startConversation('진로가 너무 불안해요')">

                    진로가 너무 불안해요

                </button>

                <button class="start-btn"
                onclick="startConversation('공부 의욕이 없어요')">

                    공부 의욕이 없어요

                </button>

                <button class="start-btn"
                onclick="startConversation('인간관계가 힘들어요')">

                    인간관계가 힘들어요

                </button>

            </div>

        </div>

    `;

    choicesDiv.innerHTML = "";

}

/* 대화 시작 */

function startConversation(text){

    chatArea.innerHTML = "";

    addMessage(text,"user");

    setTimeout(()=>{

        addMessage(
        "흥미롭네요. 그런데 정말 완벽하게 확신할 수 있는 해결책이 존재한다고 생각하시나요?",
        "bot");

        setTimeout(()=>{

            showStep();

        },700);

    },500);

}

/* 메시지 추가 */

function addMessage(text,type){

    const msg = document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    msg.innerHTML = text;

    chatArea.appendChild(msg);

    chatArea.scrollTop = chatArea.scrollHeight;

}

/* 단계 진행 */

function showStep(){

    choicesDiv.innerHTML = "";

    if(current >= steps.length){

        showReport();
        return;
    }

    addMessage(steps[current].question,"bot");

    steps[current].choices.forEach(choice=>{

        const btn = document.createElement("button");

        btn.classList.add("choice-btn");

        btn.innerText = choice.text;

        btn.onclick = ()=>{

            addMessage(choice.text,"user");

            choicesDiv.innerHTML = "";

            setTimeout(()=>{

                addMessage(choice.reply,"bot");

                current++;

                setTimeout(()=>{

                    showStep();

                },700);

            },500);

        };

        choicesDiv.appendChild(btn);

    });

}

/* 리포트 */

function showReport(){

    const report = document.createElement("div");

    report.classList.add("report");

    report.innerHTML = `

        <h2 style="margin-bottom:20px;">
            🧠 나의 상위 인지 성장 리포트
        </h2>

        <p style="margin-bottom:20px;">
            당신은 문제를 단순 감정이 아닌,
            원인과 행동 관점으로 다시 분석하기 시작했습니다.
        </p>

        <p>비판적 사고력</p>
        <div class="bar">
            <div class="fill" style="width:85%"></div>
        </div>

        <p>문해력</p>
        <div class="bar">
            <div class="fill" style="width:72%"></div>
        </div>

        <p>인지적 유연성</p>
        <div class="bar">
            <div class="fill" style="width:90%"></div>
        </div>

        <p>메타인지</p>
        <div class="bar">
            <div class="fill" style="width:80%"></div>
        </div>

    `;

    chatArea.appendChild(report);

    saveConversation();

}

/* 이전 대화 저장 */

function saveConversation(){

    currentConversationHTML = chatArea.innerHTML;

    const item = document.createElement("div");

    item.classList.add("history-item");

    item.innerText =
    "소크라테스 대화 #" +
    (historyList.children.length + 1);

    item.onclick = ()=>{

        chatArea.innerHTML = currentConversationHTML;
        choicesDiv.innerHTML = "";

    };

    historyList.prepend(item);

}

/* 새 대화 */

function resetChat(){

    current = 0;

    chatArea.innerHTML = "";

    choicesDiv.innerHTML = "";

    showStartScreen();

}

/* 최초 시작 */

showStartScreen();

</script>

</body>
</html>
