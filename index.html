<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SocraTech AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --main-color:#10a37f;
    --background-color:#212121;
    --sidebar-color:#1a1a1a;
    --chatbot-color:#2b2b2b;
    --text-color:white;
}

body{
    font-family:Arial, sans-serif;
    background:var(--background-color);
    color:var(--text-color);
    display:flex;
    height:100vh;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    transition:0.3s;
}

/* 로그인 */

.login-screen{
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    width:360px;
    background:#1f1f1f;
    padding:35px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.login-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
}

.login-box input{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2b2b2b;
    color:white;
}

.login-box button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#10a37f;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.login-message{
    text-align:center;
    font-size:14px;
    color:#bbb;
}

/* 사이드바 */

.sidebar{
    width:260px;
    background:var(--sidebar-color);
    border-right:1px solid rgba(255,255,255,0.08);
    padding:15px;
    display:flex;
    flex-direction:column;
    transition:0.3s;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.user-info{
    margin-bottom:20px;
    color:#ccc;
    font-size:14px;
}

.new-chat{
    background:var(--chatbot-color);
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:20px;
    transition:0.2s;
}

.history-title{
    color:#bdbdbd;
    margin-bottom:10px;
    font-size:14px;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

.history-item{
    background:var(--chatbot-color);
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.setting-toggle{
    margin-top:auto;
    background:var(--chatbot-color);
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:10px;
}

/* 설정창 */

.settings-box{
    display:none;
    background:var(--chatbot-color);
    padding:15px;
    border-radius:15px;
    animation:fade 0.2s ease;
}

.settings-box h3{
    margin-bottom:15px;
}

.colorContainer{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.colorBtn{
    width:30px;
    height:30px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid white;
}

.settings-box p{
    margin-bottom:8px;
}

.settings-box select,
.settings-box input[type=file]{
    width:100%;
    margin-bottom:18px;
    padding:10px;
    border:none;
    border-radius:10px;
}

/* 메인 */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:70px;
    background:rgba(0,0,0,0.2);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 25px;
}

.ai-name{
    font-size:22px;
    font-weight:bold;
}

.logout-btn{
    background:var(--main-color);
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
}

/* 채팅 */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:40px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.start-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.start-title{
    font-size:42px;
    font-weight:bold;
    margin-bottom:40px;
}

.start-choices{
    width:100%;
    max-width:700px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.start-btn{
    background:var(--chatbot-color);
    border:none;
    color:white;
    padding:18px;
    border-radius:16px;
    cursor:pointer;
    text-align:left;
    font-size:16px;
}

.message{
    max-width:70%;
    padding:18px;
    border-radius:18px;
    line-height:1.7;
    animation:fade 0.3s ease;
}

.bot{
    background:var(--chatbot-color);
    align-self:flex-start;
}

.user{
    background:var(--main-color);
    align-self:flex-end;
}

.choices{
    padding:20px;
    border-top:1px solid rgba(255,255,255,0.08);
    background:rgba(0,0,0,0.15);
    display:flex;
    flex-direction:column;
    gap:12px;
}

.choice-btn{
    background:var(--chatbot-color);
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    cursor:pointer;
    text-align:left;
}

.report{
    background:var(--chatbot-color);
    padding:25px;
    border-radius:20px;
}

.bar{
    width:100%;
    height:18px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:16px;
}

.fill{
    height:100%;
    background:var(--main-color);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<!-- 로그인 화면 -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="login-title">
            SocraTech AI
        </div>

        <input type="text"
        id="username"
        placeholder="아이디 입력">

        <input type="password"
        id="password"
        placeholder="비밀번호 입력">

        <button onclick="login()">
            로그인 / 회원가입
        </button>

        <div class="login-message">
            처음 입력한 계정은 자동 회원가입됩니다.
        </div>

    </div>

</div>

<!-- 사이드바 -->

<div class="sidebar">

    <div class="logo">
        SocraTech
    </div>

    <div class="user-info"
    id="userInfo">
        로그인 안됨
    </div>

    <button class="new-chat"
    onclick="resetChat()">

        + 새 대화

    </button>

    <div class="history-title">
        이전 대화
    </div>

    <div class="history-list"
    id="historyList"></div>

    <!-- 설정 버튼 -->

    <button class="setting-toggle"
    id="settingToggle"
    onclick="toggleSettings()">

        ⚙️ 설정 열기

    </button>

    <!-- 설정창 -->

    <div class="settings-box"
    id="settingsBox">

        <h3>⚙️ 설정</h3>

        <p>배경 색상</p>

        <div class="colorContainer">

            <!-- 기본 검정 -->

            <div class="colorBtn"
            style="background:#212121"
            onclick="changeTheme(
            '#10a37f',
            '#212121',
            '#2b2b2b',
            'white'
            )"></div>

            <div class="colorBtn"
            style="background:#ef4444"
            onclick="changeTheme(
            '#ef4444',
            '#2a1111',
            '#7f1d1d',
            'white'
            )"></div>

            <div class="colorBtn"
            style="background:#3b82f6"
            onclick="changeTheme(
            '#3b82f6',
            '#111c2f',
            '#1d4ed8',
            'white'
            )"></div>

            <div class="colorBtn"
            style="background:#f59e0b"
            onclick="changeTheme(
            '#f59e0b',
            '#2f2110',
            '#92400e',
            'white'
            )"></div>

            <div class="colorBtn"
            style="background:#8b5cf6"
            onclick="changeTheme(
            '#8b5cf6',
            '#1f1635',
            '#5b21b6',
            'white'
            )"></div>

            <div class="colorBtn"
            style="background:#ffffff"
            onclick="changeTheme(
            '#ffffff',
            '#f3f4f6',
            '#d1d5db',
            '#111'
            )"></div>

        </div>

        <p>배경 사진</p>

        <input type="file"
        accept="image/*"
        onchange="changeBackground(event)">

        <p>챗봇 말투</p>

        <select onchange="changeTone(this.value)">

            <option value="formal">
                예의있게
            </option>

            <option value="kind">
                상냥하게
            </option>

            <option value="friendly">
                친근하게
            </option>

        </select>

    </div>

</div>

<!-- 메인 -->

<div class="main">

    <div class="topbar">

        <div class="ai-name">
            SocraTech AI
        </div>

        <button class="logout-btn"
        onclick="logout()">

            로그아웃

        </button>

    </div>

    <div class="chat-area"
    id="chatArea"></div>

    <div class="choices"
    id="choices"></div>

</div>

<script>

const chatArea =
document.getElementById("chatArea");

const choicesDiv =
document.getElementById("choices");

const historyList =
document.getElementById("historyList");

let current = 0;
let currentTone = "formal";
let currentConversationHTML = "";

/* 로그인 */

function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    if(username === "" || password === ""){

        alert("아이디와 비밀번호를 입력하세요.");
        return;

    }

    localStorage.setItem(
        "socraUser",
        username
    );

    localStorage.setItem(
        "socraPass",
        password
    );

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "userInfo"
    ).innerHTML =
    "👤 " + username + "님";

}

/* 자동 로그인 */

window.onload = function(){

    const savedUser =
    localStorage.getItem("socraUser");

    if(savedUser){

        document.getElementById(
            "loginScreen"
        ).style.display = "none";

        document.getElementById(
            "userInfo"
        ).innerHTML =
        "👤 " + savedUser + "님";

    }

}

/* 로그아웃 */

function logout(){

    localStorage.removeItem("socraUser");
    localStorage.removeItem("socraPass");

    location.reload();

}

/* 질문 */

const steps = [

{
    question:"그 문제의 가장 큰 원인은 무엇이라고 생각하나요?",

    choices:[

        {
            text:"자신감 부족",
            reply:"그렇다면 질문자님이 생각하는 자신감 있는 사람은 어떤 사람인가요?"
        },

        {
            text:"실패 경험",
            reply:"과거의 실패가 현재의 선택 기준까지 결정하고 있는 걸까요?"
        },

        {
            text:"주변 환경",
            reply:"같은 환경에서도 다른 결과를 만드는 사람도 있지 않을까요?"
        }

    ]
},

{
    question:"지금 가장 바꾸고 싶은 것은 무엇인가요?",

    choices:[

        {
            text:"생각 습관",
            reply:"평소 어떤 순간에 깊게 고민하지 않고 결론을 내려버리나요?"
        },

        {
            text:"행동 방식",
            reply:"가장 먼저 바꿀 수 있는 아주 작은 행동 하나는 무엇일까요?"
        },

        {
            text:"감정 조절",
            reply:"감정이 가장 크게 흔들리는 상황은 어떤 순간인가요?"
        }

    ]
},

{
    question:"지금 당신에게 가장 필요한 것은 무엇인가요?",

    choices:[

        {
            text:"명확한 목표",
            reply:"그 목표는 정말 본인의 선택인가요?"
        },

        {
            text:"휴식",
            reply:"충분히 쉬지 못하게 만드는 가장 큰 이유는 무엇인가요?"
        },

        {
            text:"새로운 도전",
            reply:"실패 가능성이 있어도 도전하고 싶은 이유는 무엇인가요?"
        }

    ]
}

];

/* 시작 */

function showStartScreen(){

    const username =
    localStorage.getItem("socraUser") || "사용자";

    chatArea.innerHTML = `

    <div class="start-screen">

        <div class="start-title">

            안녕하세요, ${username}님.<br>
            오늘의 고민은 무엇인가요?

        </div>

        <div class="start-choices">

            <button class="start-btn"
            onclick="startConversation('진로가 너무 불안해요')">

                진로가 너무 불안해요

            </button>

            <button class="start-btn"
            onclick="startConversation('공부 의욕이 없어요')">

                공부 의욕이 없어요

            </button>

            <button class="start-btn"
            onclick="startConversation('인간관계가 힘들어요')">

                인간관계가 힘들어요

            </button>

        </div>

    </div>

    `;

    choicesDiv.innerHTML = "";

}

/* 말투 */

function applyTone(text){

    if(currentTone === "kind"){

        return "😊 " + text +
        " 천천히 생각해봐도 좋아요.";

    }

    if(currentTone === "friendly"){

        return "😄 " + text
        .replaceAll("무엇인가요?", "뭘까?")
        .replaceAll("있을까요?", "있을까?");

    }

    return text;

}

/* 시작 */

function startConversation(text){

    chatArea.innerHTML = "";

    addMessage(text,"user");

    setTimeout(()=>{

        addMessage(
        "흥미롭네요. 그런데 정말 완벽한 해결책이 존재한다고 생각하시나요?",
        "bot");

        setTimeout(()=>{

            showStep();

        },700);

    },500);

}

/* 메시지 */

function addMessage(text,type){

    const msg =
    document.createElement("div");

    msg.classList.add("message");
    msg.classList.add(type);

    if(type === "bot"){

        msg.innerHTML =
        applyTone(text);

    }else{

        msg.innerHTML = text;

    }

    chatArea.appendChild(msg);

    chatArea.scrollTop =
    chatArea.scrollHeight;

}

/* 단계 */

function showStep(){

    choicesDiv.innerHTML = "";

    if(current >= steps.length){

        showReport();
        return;

    }

    addMessage(
        steps[current].question,
        "bot"
    );

    steps[current].choices.forEach(choice=>{

        const btn =
        document.createElement("button");

        btn.classList.add("choice-btn");

        btn.innerText = choice.text;

        btn.onclick = ()=>{

            addMessage(choice.text,"user");

            choicesDiv.innerHTML = "";

            setTimeout(()=>{

                addMessage(
                    choice.reply,
                    "bot"
                );

                current++;

                setTimeout(()=>{

                    showStep();

                },700);

            },500);

        };

        choicesDiv.appendChild(btn);

    });

}

/* 랜덤 */

function randomValue(){

    return Math.floor(
        Math.random()*31
    )+60;

}

/* 리포트 */

function showReport(){

    const critical = randomValue();
    const literacy = randomValue();
    const flexible = randomValue();
    const meta = randomValue();

    const report =
    document.createElement("div");

    report.classList.add("report");

    report.innerHTML = `

        <h2 style="margin-bottom:20px;">
            🧠 나의 상위 인지 성장 리포트
        </h2>

        <p style="margin-bottom:20px;">
            당신은 문제를 감정이 아닌,
            원인과 행동 관점에서 분석하기 시작했습니다.
        </p>

        <p>비판적 사고력 (${critical}%)</p>

        <div class="bar">
            <div class="fill"
            style="width:${critical}%"></div>
        </div>

        <p>문해력 (${literacy}%)</p>

        <div class="bar">
            <div class="fill"
            style="width:${literacy}%"></div>
        </div>

        <p>인지적 유연성 (${flexible}%)</p>

        <div class="bar">
            <div class="fill"
            style="width:${flexible}%"></div>
        </div>

        <p>메타인지 (${meta}%)</p>

        <div class="bar">
            <div class="fill"
            style="width:${meta}%"></div>
        </div>

    `;

    chatArea.appendChild(report);

    saveConversation();

}

/* 저장 */

function saveConversation(){

    currentConversationHTML =
    chatArea.innerHTML;

    const item =
    document.createElement("div");

    item.classList.add("history-item");

    item.innerText =
    "소크라테스 대화 #" +
    (historyList.children.length + 1);

    item.onclick = ()=>{

        chatArea.innerHTML =
        currentConversationHTML;

        choicesDiv.innerHTML = "";

    };

    historyList.prepend(item);

}

/* 초기화 */

function resetChat(){

    current = 0;

    chatArea.innerHTML = "";

    choicesDiv.innerHTML = "";

    showStartScreen();

}

/* 설정 */

function toggleSettings(){

    const box =
    document.getElementById("settingsBox");

    const btn =
    document.getElementById("settingToggle");

    if(box.style.display === "block"){

        box.style.display = "none";

        btn.innerHTML =
        "⚙️ 설정 열기";

    }else{

        box.style.display = "block";

        btn.innerHTML =
        "⚙️ 설정 닫기";

    }

}

/* 배경 */

function changeBackground(event){

    const file =
    event.target.files[0];

    if(file){

        const reader =
        new FileReader();

        reader.onload = function(e){

            document.body.style.backgroundImage =
            `url(${e.target.result})`;

        }

        reader.readAsDataURL(file);

    }

}

/* 말투 */

function changeTone(tone){

    currentTone = tone;

}

/* 테마 */

function changeTheme(
mainColor,
bgColor,
chatColor,
textColor="white"
){

    document.documentElement.style
    .setProperty(
        '--main-color',
        mainColor
    );

    document.documentElement.style
    .setProperty(
        '--background-color',
        bgColor
    );

    document.documentElement.style
    .setProperty(
        '--sidebar-color',
        bgColor
    );

    document.documentElement.style
    .setProperty(
        '--chatbot-color',
        chatColor
    );

    document.documentElement.style
    .setProperty(
        '--text-color',
        textColor
    );

}

/* 시작 */

showStartScreen();

</script>

</body>
</html>
